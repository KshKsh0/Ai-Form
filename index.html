<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Form Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar for the preview panel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Subtle Dot Background for the canvas area */
        .dot-bg {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen text-slate-800 antialiased overflow-hidden flex flex-col">

    <!-- Navbar -->
    <header class="glass-panel border-b border-indigo-100 px-6 py-4 flex justify-between items-center z-10 relative shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 tracking-tight">AI Form Architect</h1>
        </div>
        <div class="text-sm font-medium text-slate-500 bg-white shadow-sm px-4 py-2 rounded-full border border-slate-200">
            Powered by Ollama & Gemini
        </div>
    </header>

    <!-- Main Layout -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Controls (Left) -->
        <aside class="w-full md:w-1/3 lg:w-1/4 glass-panel border-r border-indigo-100 flex flex-col p-6 overflow-y-auto relative z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
            <h2 class="text-lg font-semibold tracking-tight text-slate-800 mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                Configuration
            </h2>
            
            <div class="space-y-5 flex-1 text-sm">
                <!-- Provider Setup -->
                <div class="space-y-2">
                    <label for="providerSelect" class="block font-medium text-slate-700">AI Provider</label>
                    <div class="relative">
                        <select id="providerSelect" class="w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2.5 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow shadow-sm cursor-pointer">
                            <option value="gemini">Google Gemini (Cloud)</option>
                            <option value="ollama">Ollama (Local Models)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Model Setup -->
                <div class="space-y-2" id="model-container" style="display: none;">
                    <label for="modelSelect" class="block font-medium text-slate-700">Local Model</label>
                    <div class="relative">
                        <select id="modelSelect" class="w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2.5 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow shadow-sm cursor-pointer">
                            <option value="">Loading models...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Prompt Setup -->
                <div class="space-y-2">
                    <label for="promptInput" class="block font-medium text-slate-700">Survey Description</label>
                    <textarea id="promptInput" rows="6" class="w-full bg-white border border-slate-300 text-slate-800 py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow shadow-sm resize-none placeholder-slate-400" placeholder="E.g., A sleek employee feedback form asking for rating, department, and general suggestions..."></textarea>
                </div>
            </div>

            <!-- Action Button -->
            <div class="mt-8">
                <button id="genBtn" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-indigo-500/30 transition-all duration-300 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Generate UI
                </button>
            </div>
        </aside>

        <!-- Canvas Area (Right) -->
        <section class="flex-1 dot-bg relative flex flex-col p-6 lg:p-10 overflow-y-auto">
            
            <!-- Canvas Toolbar -->
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-700">Live Preview</h3>
                <button id="copyBtn" class="hidden items-center gap-2 bg-white border border-slate-200 text-slate-700 hover:text-indigo-600 hover:border-indigo-200 font-medium py-2 px-4 rounded-lg shadow-sm transition-colors text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copy HTML
                </button>
            </div>

            <!-- Preloader state -->
            <div id="loaderState" class="hidden absolute inset-0 bg-white/50 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
                <div class="relative w-20 h-20">
                    <div class="absolute inset-0 border-4 border-indigo-100 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <h4 class="mt-6 text-lg font-semibold text-slate-700 animate-pulse">Architecting your UI...</h4>
                <p class="text-sm text-slate-500 mt-2">The AI is weaving Tailwind classes together.</p>
            </div>

            <!-- Form Container -->
            <div id="form-preview" class="w-full max-w-4xl mx-auto flex-1 flex items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl bg-white/40 min-h-[400px] p-4 transition-all">
                <div class="text-center w-full">
                    <div class="inline-flex bg-indigo-50 text-indigo-500 p-4 rounded-full mb-4">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path></svg>
                    </div>
                    <p class="text-slate-500 font-medium">Your customized UI will render here instantly.</p>
                </div>
            </div>

        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 bg-white px-6 py-4 rounded-xl shadow-2xl border-l-4 border-emerald-500 flex items-center gap-3 z-50">
        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <p class="text-slate-800 font-medium text-sm" id="toast-msg">Copied to clipboard!</p>
    </div>

<script>
    const btn = document.getElementById('genBtn');
    const preview = document.getElementById('form-preview');
    const input = document.getElementById('promptInput');
    const providerSelector = document.getElementById('providerSelect');
    const modelContainer = document.getElementById('model-container');
    const modelSelect = document.getElementById('modelSelect');
    const loaderState = document.getElementById('loaderState');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    
    let generatedRawHTML = "";

    const API_BASE = "http://127.0.0.1:8000";

    // 1. Fetch Local Models from FastAPI on load
    async function loadOllamaModels() {
        try {
            modelSelect.disabled = true;
            modelSelect.innerHTML = '<option value="">Searching local system...</option>';
            const response = await fetch(`${API_BASE}/models`);
            const data = await response.json();
            
            modelSelect.innerHTML = ''; 
            
            if (data.models && data.models.length > 0) {
                data.models.forEach(model => {
                    const opt = document.createElement('option');
                    opt.value = model;
                    opt.textContent = model;
                    modelSelect.appendChild(opt);
                });
            } else {
                modelSelect.innerHTML = '<option value="">No models found on PC</option>';
            }
        } catch (err) {
            console.error("Failed to fetch models:", err);
            modelSelect.innerHTML = '<option value="">Error connecting to API</option>';
        } finally {
            modelSelect.disabled = false;
        }
    }

    // Toggle Ollama view
    providerSelector.addEventListener('change', () => {
        if (providerSelector.value === 'ollama') {
            modelContainer.style.display = 'block';
            if(modelSelect.options.length <= 1) loadOllamaModels();
        } else {
            modelContainer.style.display = 'none';
        }
    });

    // Toast Utility
    function showToast(msg = 'Success') {
        document.getElementById('toast-msg').textContent = msg;
        toast.classList.remove('translate-y-24', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
    }

    // Copy to clipboard
    copyBtn.addEventListener('click', () => {
        if (!generatedRawHTML) return;
        navigator.clipboard.writeText(generatedRawHTML).then(() => showToast('HTML Source Copied!'));
    });

    btn.addEventListener('click', async () => {
        const text = input.value.trim();
        const provider = providerSelector.value;
        const model = modelSelect.value;

        if(!text) {
            input.classList.add('border-red-400', 'ring-red-400', 'ring-2');
            setTimeout(() => input.classList.remove('border-red-400', 'ring-red-400', 'ring-2'), 1000);
            return;
        }
        if(provider === 'ollama' && !model) return alert("Please select a local model!");

        // UI Reset & Preloader State
        btn.disabled = true;
        btn.innerHTML = `<svg class="animate-spin w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Generating...`;
        
        preview.classList.remove('border-dashed', 'border-slate-300', 'items-center', 'justify-center', 'bg-white/40');
        preview.classList.add('bg-transparent');
        preview.innerHTML = ''; 
        loaderState.classList.remove('hidden');
        copyBtn.classList.replace('flex', 'hidden');

        try {
            const response = await fetch(`${API_BASE}/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "id": Date.now().toString(),
                    "txt": text,
                    "provider": provider,
                    "model": model || "gemini-2.5-flash"
                })
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            
            // Handle output rendering
            let result = typeof data.output === 'string' ? JSON.parse(data.output) : data.output;

            if(result && result.html) {
                generatedRawHTML = result.html;
                // Add the style block safely if necessary
                preview.innerHTML = `<div class="w-full flex justify-center fade-in">${result.html}</div>`;
                copyBtn.classList.replace('hidden', 'flex'); // Show copy
            } else {
                throw new Error("Invalid response format from AI.");
            }

        } catch (err) {
            preview.innerHTML = `
                <div class="flex flex-col items-center justify-center p-8 text-center text-red-500 w-full h-full bg-red-50/50 rounded-xl border border-red-100">
                    <svg class="w-10 h-10 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span class="font-bold">Error Processing Request</span>
                    <span class="text-sm text-red-400 mt-1">${err.message}</span>
                </div>
            `;
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Generate UI`;
            loaderState.classList.add('hidden');
        }
    });

    // Style helper for animations
    const styleObj = document.createElement('style');
    styleObj.innerHTML = `
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    `;
    document.head.appendChild(styleObj);
</script>

</body>
</html>
